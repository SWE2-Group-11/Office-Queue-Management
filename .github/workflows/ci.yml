name: Continuous Integration

on:
  push:
    branches: [ "main", "dev", "QA" ]
  pull_request:
    branches: [ "main", "dev", "QA" ]

jobs:
  # --- BACKEND JOB (Express + TS) ---
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Set default execution context to backend directory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Linter (Oxlint)
        run: npx oxlint

      - name: Type-check Backend TypeScript
        run: npx tsc --noEmit

      - name: Run Backend Tests (Vitest)
        run: npx vitest run

  # --- FRONTEND JOB (React + Vite + TS) ---
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # Set default execution context to frontend directory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Linter (Oxlint)
        run: npx oxlint

      - name: Type-check Frontend TypeScript
        run: npx tsc -b --noEmit

      # Uncomment the following lines if you have tests configured in the frontend
      # - name: Run Frontend Tests
      #   run: npx vitest run

  # --- END-TO-END JOB (Playwright) ---
  e2e-ci:
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'QA')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./e2e/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --prefix ../backend

      - name: Install Frontend Dependencies
        run: npm ci --prefix ../frontend

      - name: Install E2E Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Run Playwright E2E Tests
        run: npm test
